<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tigerGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#E05300" />
    </linearGradient>
    <linearGradient id="tigerGradGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFAE19" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <linearGradient id="tigerDarkShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1C24" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>
    <filter id="tigerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF6B00" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Shield Crest -->
  <polygon points="60,4 112,22 98,88 60,116 22,88 8,22" fill="url(#tigerDarkShield)" stroke="#FF6B00" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="60,10 106,26 93,84 60,109 27,84 14,26" fill="#12151E" stroke="#FF9E00" stroke-width="1" stroke-opacity="0.4" stroke-linejoin="round" />

  <!-- Outer Ears (Geometric) -->
  <!-- Left Ear -->
  <polygon points="26,30 40,20 44,38" fill="url(#tigerGradPrimary)" />
  <polygon points="29,31 38,24 41,36" fill="#12151E" />
  <!-- Right Ear -->
  <polygon points="94,30 80,20 76,38" fill="url(#tigerGradPrimary)" />
  <polygon points="91,31 82,24 79,36" fill="#12151E" />

  <!-- Main Head Silhouette (Tiger Face Outer) -->
  <polygon points="60,26 80,28 92,42 98,62 88,72 80,68 76,82 60,94 44,82 40,68 32,72 22,62 28,42 40,28" fill="url(#tigerGradPrimary)" filter="url(#tigerGlow)" />

  <!-- Cheek Tufts & Side Rims (Dark Insets) -->
  <polygon points="22,62 32,54 36,66" fill="#0A0B0E" />
  <polygon points="98,62 88,54 84,66" fill="#0A0B0E" />
  <polygon points="32,72 40,68 36,78" fill="#FF9E00" />
  <polygon points="88,72 80,68 84,78" fill="#FF9E00" />

  <!-- Forehead Stripes (Classic Tiger '王' / M-Crest) -->
  <!-- Center Spike -->
  <polygon points="60,28 64,42 60,46 56,42" fill="#0A0B0E" />
  <!-- Upper Horizontal Bar -->
  <polygon points="46,34 74,34 68,38 52,38" fill="#0A0B0E" />
  <!-- Mid Side Stripes -->
  <polygon points="42,42 52,43 46,47" fill="#0A0B0E" />
  <polygon points="78,42 68,43 74,47" fill="#0A0B0E" />

  <!-- Brow & Eye Bridges -->
  <polygon points="60,52 68,48 78,51 68,54" fill="#0A0B0E" />
  <polygon points="60,52 52,48 42,51 52,54" fill="#0A0B0E" />

  <!-- Fierce Eyes (White & Bright Gold) -->
  <!-- Left Eye -->
  <polygon points="43,53 54,55 46,60" fill="#FFFFFF" />
  <polygon points="46,55 52,56 48,59" fill="#FFC700" />
  <polygon points="48,55 50,56 48,58" fill="#000000" />
  <!-- Right Eye -->
  <polygon points="77,53 66,55 74,60" fill="#FFFFFF" />
  <polygon points="74,55 68,56 72,59" fill="#FFC700" />
  <polygon points="72,55 70,56 72,58" fill="#000000" />

  <!-- Eye Liner & Tear Ducts -->
  <polygon points="41,51 55,54 52,56 42,54" fill="#0A0B0E" />
  <polygon points="79,51 65,54 68,56 78,54" fill="#0A0B0E" />

  <!-- Bridge of Nose -->
  <polygon points="60,52 64,68 56,68" fill="url(#tigerGradGlow)" />
  <polygon points="60,55 62,66 58,66" fill="#FF6B00" />

  <!-- Nose (Dark Hex/Triangle) -->
  <polygon points="56,69 64,69 60,75" fill="#0A0B0E" />

  <!-- Muzzle & Whisker Pads (White Geometric) -->
  <!-- Left Muzzle -->
  <polygon points="60,74 54,72 46,72 50,78 57,80" fill="#FFFFFF" />
  <polygon points="46,72 38,72 44,77" fill="#0A0B0E" />
  <!-- Right Muzzle -->
  <polygon points="60,74 66,72 74,72 70,78 63,80" fill="#FFFFFF" />
  <polygon points="74,72 82,72 76,77" fill="#0A0B0E" />

  <!-- Fierce Fangs & Snarl -->
  <polygon points="51,80 54,80 52,86" fill="#FFFFFF" stroke="#0A0B0E" stroke-width="0.5" />
  <polygon points="69,80 66,80 68,86" fill="#FFFFFF" stroke="#0A0B0E" stroke-width="0.5" />
  <!-- Center Lower Jaw -->
  <polygon points="54,82 66,82 60,91" fill="#0A0B0E" />
  <polygon points="56,86 64,86 60,90" fill="#FFFFFF" />

  <!-- Accent Edge Highlights (Gold Lightning) -->
  <polyline points="20,24 60,6 100,24" stroke="#FFAE19" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  <polyline points="60,98 72,86 82,74" stroke="#FF9E00" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  <polyline points="60,98 48,86 38,74" stroke="#FF9E00" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>
